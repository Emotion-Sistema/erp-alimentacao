name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Três trabalhos em paralelo (pedido do responsável, 25/11/2026: aprovações mais rápidas):
#  - "base": lint, tipos, migrações, testes contra o PostgreSQL real e build;
#  - "tela": os testes de tela divididos em 2 partes, cada uma com o próprio banco e servidores;
#  - "Lint, tipos, testes e build": o teste OBRIGATÓRIO da regra da main. Só fica verde se a base
#    e as 2 partes da tela passarem (o nome não muda, para a regra "main protegida" continuar valendo).
jobs:
  base:
    name: Base (lint, tipos, testes e build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: erp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U erp -d erp"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://erp:erp@localhost:5432/erp
      DATABASE_URL_TESTE: postgres://erp:erp@localhost:5432/erp_teste
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Tipos
        run: pnpm tipos
      - name: Banco de teste
        run: PGPASSWORD=erp psql -h localhost -U erp -d erp -c "CREATE DATABASE erp_teste OWNER erp;"
      - name: Migrações aplicam, revertem e aplicam de novo
        run: pnpm banco:migrar && pnpm banco:reverter && pnpm banco:migrar
      - name: Testes (PostgreSQL real)
        run: pnpm teste
      - name: Build
        run: pnpm build

  tela:
    name: Testes de tela (parte ${{ matrix.parte }} de 2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        parte: [1, 2]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: erp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U erp -d erp"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://erp:erp@localhost:5432/erp
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # O navegador fica guardado entre rodadas (muda só quando a versão do Playwright muda).
      - name: Versão do Playwright
        id: pw
        run: echo "versao=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Navegador guardado
        id: cache-pw
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.versao }}
      - name: Navegador dos testes de tela
        if: steps.cache-pw.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Bibliotecas do navegador
        if: steps.cache-pw.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: Testes de tela (cada cargo pela tela)
        run: pnpm teste:tela --shard=${{ matrix.parte }}/2

  verificar:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    needs: [base, tela]
    if: always()
    steps:
      - name: Tudo passou?
        run: |
          echo "base: ${{ needs.base.result }} | tela: ${{ needs.tela.result }}"
          test "${{ needs.base.result }}" = "success" && test "${{ needs.tela.result }}" = "success"

  homologacao:
    name: Ensaio da homologação (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Scripts do servidor sem erro
        run: |
          shellcheck -S warning infra/homologacao/*.sh infra/homologacao/erp
          bash infra/homologacao/confere-colar.sh
      - name: Imagem, migrações com papéis separados, HTTPS, login pelo proxy
        run: bash infra/homologacao/ensaio-local.sh
